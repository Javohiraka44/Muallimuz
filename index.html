<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MuallimUz - Telegram Web App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="style.css">
    <!-- IKONKALAR UCHUN RASMIY VA TO'LIQ FONTAWESOME HAVOLASI -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Yuqori Panel va Dinamik Salomlashish -->
    <header class="twa-header">
        <div class="user-greeting">
            <h2 id="greeting-text">Xush kelibsiz, Mehmon 👋</h2>
            <p>MuallimUz platformasiga marhamat!</p>
        </div>
        <div class="logo-mini">
            <h1>M<span>Uz</span></h1>
        </div>
    </header>

    <!-- Qidiruv Paneli (Qidiruv 🔍 ikonkalari bilan) -->
    <div class="twa-search-container">
        <div class="twa-search-box">
            <input type="text" placeholder="Kurslar, fanlar yoki ustozlarni qidiring...">
            <button><i class="fas fa-magnifying-glass"></i></button>
        </div>
    </div>

    <!-- Navigatsiya punktlari (Har bir bo'lim uchun aniq va chiroyli ikonka) -->
    <main class="twa-menu-grid">
        <a href="oqtuvchilar.html" class="grid-item">
            <div class="icon-wrapper teacher-bg"><i class="fas fa-chalkboard-user"></i></div>
            <span>O'qituvchi</span>
        </a>
        <a href="oquvchilar.html" class="grid-item">
            <div class="icon-wrapper student-bg"><i class="fas fa-graduation-cap"></i></div>
            <span>O'quvchi</span>
        </a>
        <a href="fanlar.html" class="grid-item">
            <div class="icon-wrapper subject-bg"><i class="fas fa-book-open"></i></div>
            <span>Fanlar</span>
        </a>
        <a href="testlar.html" class="grid-item">
            <div class="icon-wrapper class-bg"><i class="fas fa-file-pen"></i></div>
            <span>Testlar</span>
        </a>
    </main>

    <!-- Sun'iy Intellekt (Gemini AI) Oynasi -->
    <div class="twa-ai-section">
        <div class="twa-ai-header">
            <h3><i class="fas fa-brain"></i> MuallimUz AI (Gemini)</h3>
        </div>
        <div class="twa-ai-body">
            <div class="chat-messages" id="chat-messages">
                <p class="ai-msg" id="ai-welcome-msg"><i class="fas fa-robot" style="margin-right: 5px; color: #2481cc;"></i> Assalomu alaykum! Men ta'lim bo'yicha sun'iy intellekt yordamchisiman. O'zbekiston ta'lim tizimiga oid har qanday savolingizga javob bera olaman.</p>
            </div>
            <!-- Xabar yuborish ✈️ ikonkalari bilan kirish qismi -->
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Savolingizni bering...">
                <button onclick="sendAiMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Vaqtga qarab salomlashish va foydalanuvchi ismini chiqarish funksiyasi
        function setDinamikGreeting() {
            const greetingElement = document.getElementById('greeting-text');
            const hours = new Date().getHours();
            let statusGreeting = "Xush kelibsiz";

            if (hours >= 5 && hours < 12) {
                statusGreeting = "Xayrli tong";
            } else if (hours >= 12 && hours < 17) {
                statusGreeting = "Xayrli kun";
            } else if (hours >= 17 && hours < 22) {
                statusGreeting = "Xayrli kech";
            } else {
                statusGreeting = "Xush kelibsiz";
            }

            let firstName = "Foydalanuvchi";
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                firstName = tg.initDataUnsafe.user.first_name;
            }

            greetingElement.innerHTML = `${statusGreeting}, ${firstName} 👋`;
        }

        setDinamikGreeting();

        // Gemini Backend API ulanishi (Render manzili bilan)
        async function sendAiMessage() {
            const input = document.getElementById('user-input');
            const messagesContainer = document.getElementById('chat-messages');
            const userText = input.value.trim();
            
            if (userText !== "") {
                let userMsg = document.createElement('p');
                userMsg.className = 'user-msg';
                userMsg.innerHTML = `<i class="fas fa-user" style="margin-right: 5px;"></i> ${userText}`;
                messagesContainer.appendChild(userMsg);
                input.value = "";
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                let loadingMsg = document.createElement('p');
                loadingMsg.className = 'ai-msg';
                loadingMsg.style.fontStyle = 'italic';
                loadingMsg.innerHTML = `<i class="fas fa-spinner fa-spin" style="margin-right: 5px;"></i> Tahlil qilinmoqda...`;
                messagesContainer.appendChild(loadingMsg);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                try {
                    // DTM/Vazirlik ma'lumotlarini oluvchi Render serveringiz manzili
                    const response = await fetch('https://muallimuz-8.onrender.com/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userText })
                    });
                    const data = await response.json();
                    
                    messagesContainer.removeChild(loadingMsg);
                    let aiMsg = document.createElement('p');
                    aiMsg.className = 'ai-msg';
                    aiMsg.innerHTML = `<i class="fas fa-robot" style="margin-right: 5px; color: #2481cc;"></i> ${data.reply || "Ma'lumot topilmadi."}`;
                    messagesContainer.appendChild(aiMsg);
                } catch (error) {
                    messagesContainer.removeChild(loadingMsg);
                    let errorMsg = document.createElement('p');
                    errorMsg.className = 'ai-msg';
                    errorMsg.innerHTML = `<i class="fas fa-circle-exclamation" style="margin-right: 5px; color: #e74c3c;"></i> Serverga ulanib bo'lmadi. Render-da muammo borligini tekshiring.`;
                    messagesContainer.appendChild(errorMsg);
                }

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        }
    </script>
</body>
</html>
